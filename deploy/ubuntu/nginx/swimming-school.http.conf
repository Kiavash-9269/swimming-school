# Temporary HTTP-only site (first boot / before Let's Encrypt).
# DOMAIN placeholders are replaced by setup.sh.

# Site files are included inside nginx's http {} block, so these zones are valid here.
limit_req_zone  $binary_remote_addr zone=swim_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=swim_conn:10m;

upstream swimming_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/swimming-school/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    limit_conn swim_conn 60;
    limit_req_status  429;
    limit_conn_status 429;

    gzip_static on;
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    access_log off;
    error_log  /var/log/nginx/swimming-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        limit_req zone=swim_api burst=60 nodelay;
        proxy_pass http://swimming_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_cookie_path / /;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:webp|avif|jpe?g|png|gif|ico|svg|woff2?|ttf|mp4|webm)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
