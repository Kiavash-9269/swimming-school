# Full HTTPS site after certbot has issued certificates.
# DOMAIN placeholders are replaced by setup.sh / harden-production.sh / optimize-server.sh.

limit_req_zone  $binary_remote_addr zone=swim_api:10m rate=15r/s;
limit_req_zone  $binary_remote_addr zone=swim_general:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=swim_conn:10m;

upstream swimming_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Drop direct-IP / wrong-host noise (444 = close, no response)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    root /var/www/swimming-school/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    limit_conn swim_conn 100;
    limit_req_status  429;
    limit_conn_status 429;

    gzip_static on;
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    access_log off;
    error_log  /var/log/nginx/swimming-error.log warn;

    # Common exploit probes
    location ~* ^/(\.env|\.git|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|\.aws|actuator) {
        deny all;
        return 404;
    }

    location /api/ {
        limit_req zone=swim_api burst=40 nodelay;
        proxy_pass http://swimming_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_cookie_path / /;
    }

    location = /api/health {
        access_log off;
        limit_req zone=swim_api burst=10 nodelay;
        proxy_pass http://swimming_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /assets/ {
        limit_req zone=swim_general burst=80 nodelay;
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    location /videos/ {
        limit_req zone=swim_general burst=40 nodelay;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ~* \.(?:webp|avif|jpe?g|png|gif|ico|svg|woff2?|ttf|mp4|webm)$ {
        limit_req zone=swim_general burst=60 nodelay;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # No add_header inside locations: nginx would drop the server-level security headers.
    location = /index.html {
        limit_req zone=swim_general burst=30 nodelay;
        expires epoch;
    }

    location / {
        limit_req zone=swim_general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
